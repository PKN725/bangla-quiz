<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলা কুইজ গেম</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Bengali","Kalpurush",Arial,sans-serif;background:linear-gradient(135deg,#1d2b64,#f8cdda);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
  h1{margin:0 0 8px;color:#1d2b64}
  p{color:#444}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:18px;padding:12px 24px}
  .primary{background:#e63946;color:#fff}
  .opt{display:block;width:100%;margin:10px 0;background:#f1f3f9;color:#222;text-align:left;border:2px solid transparent}
  .opt:hover:not(:disabled){border-color:#1d2b64}
  .opt.correct{background:#c8f7c5;border-color:#2e9e3a}
  .opt.wrong{background:#ffd0d0;border-color:#d62828}
  .top{display:flex;justify-content:space-between;color:#555;font-size:15px;margin-bottom:10px}
  .bar{height:8px;background:#e5e5e5;border-radius:6px;overflow:hidden;margin-bottom:16px}
  .bar div{height:100%;background:#e63946;width:0;transition:width .3s}
  .q{font-size:21px;font-weight:bold;color:#222;margin:10px 0 16px}
  .score{font-size:48px;color:#e63946;margin:10px 0}
  .home{display:inline-block;margin-top:14px;color:#1d2b64;text-decoration:none}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">

  <div id="start">
    <h1>🧠 বাংলা কুইজ</h1>
    <p>সাধারণ জ্ঞানের ১০টি প্রশ্ন। দেখি আপনি কত পান!</p>
    <button class="primary" onclick="startGame()">▶ শুরু করুন</button><br>
    <a class="home" href="HOME_LINK">← হোমে ফিরুন</a>
  </div>

  <div id="game" class="hide">
    <div class="top"><span id="num"></span><span id="sc"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <button class="primary hide" id="next" onclick="nextQ()">পরের প্রশ্ন →</button>
  </div>

  <div id="end" class="hide">
    <h1 id="msg"></h1>
    <div class="score" id="final"></div>
    <p id="sub"></p>
    <button class="primary" onclick="startGame()">🔄 আবার খেলুন</button><br>
    <button onclick="shareScore()" style="margin-top:10px;background:#25d366;color:#fff">📤 শেয়ার করুন</button><br>
    <a class="home" href="HOME_LINK">← হোমে ফিরুন</a>
  </div>

</div>

function startGame(){
  qs = shuffle(ALL).slice(0, TOTAL);
  idx = 0; score = 0;
  $("start").classList.add("hide"); $("end").classList.add("hide"); $("game").classList.remove("hide");
  showQ();
}
function showQ(){
  locked = false;
  const [q, opts, ans] = qs[idx];
  $("num").textContent = "প্রশ্ন " + bn(idx+1) + "/" + bn(qs.length);
  $("sc").textContent = "স্কোর: " + bn(score);
  $("prog").style.width = (idx/qs.length*100) + "%";
  $("q").textContent = q;
  $("next").classList.add("hide");
  $("opts").innerHTML = "";
  // অপশন শাফল করা, সঠিক উত্তর ট্র্যাক করা
  const order = shuffle(opts.map((t,i)=>({t,ok:i===ans})));
  order.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.t;
    b.onclick = () => pick(b, o.ok);
    b.dataset.ok = o.ok;
    $("opts").appendChild(b);
  });
}
function pick(btn, ok){
  if(locked) return; locked = true;
  if(ok){ score++; btn.classList.add("correct"); }
  else { btn.classList.add("wrong"); }
  document.querySelectorAll(".opt").forEach(b => { if(b.dataset.ok==="true") b.classList.add("correct"); b.disabled = true; });
  $("sc").textContent = "স্কোর: " + bn(score);
  $("next").textContent = idx === qs.length-1 ? "ফলাফল দেখুন →" : "পরের প্রশ্ন →";
  $("next").classList.remove("hide");
}
function nextQ(){
  idx++;
  if(idx >= qs.length) return finish();
  showQ();
}
function finish(){
  $("game").classList.add("hide"); $("end").classList.remove("hide");
  $("final").textContent = bn(score) + "/" + bn(qs.length);
  let m, s;
  if(score >= 9){ m="🏆 অসাধারণ!"; s="আপনি সত্যিকারের জ্ঞানবাজ!"; }
  else if(score >= 6){ m="👏 চমৎকার!"; s="আরেকবার খেলে পুরো নম্বর পেতে পারেন।"; }
  else if(score >= 4){ m="🙂 মোটামুটি"; s="আবার চেষ্টা করুন, নিশ্চয়ই ভালো করবেন।"; }
  else { m="📚 আরও চর্চা দরকার"; s="হাল ছাড়বেন না, আবার খেলুন!"; }
  $("msg").textContent = m; $("sub").textContent = s;
}
function shareScore(){
  const text = "আমি বাংলা কুইজে " + bn(score) + "/" + bn(qs.length) + " পেয়েছি! তুমি কত পাও? ";
  const url = location.href;
  if(navigator.share){ navigator.share({title:"বাংলা কুইজ", text, url}).catch(()=>{}); }
  else { window.open("https://wa.me/?text=" + encodeURIComponent(text + url), "_blank"); }
}
</script>
